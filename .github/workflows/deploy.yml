name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'master']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        # O puppeteer so e usado pela bancada de teste (teste/gerar.js) e baixaria
        # o Chrome (~150 MB) em todo deploy se o postinstall rodasse.
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        
      - name: Type-check
        run: npm run lint
        
      - name: Tests
        run: npm test
        
      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
