<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XML Template Engine · Editor Interativo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m18%2016%204-4-4-4%22%2F%3E%3Cpath%20d%3D%22m6%208-4%204%204%204%22%2F%3E%3Cpath%20d%3D%22m14.5%204-5%2016%22%2F%3E%3C%2Fsvg%3E" />
    <meta name="description" content="Motor de templates XML com formulário reativo, editor em tempo real e exportação para Word." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!--
      =====================================================================
      Bibliotecas Pesadas via CDN (pdfmake, docx, mammoth, jszip)
      ---------------------------------------------------------------------
      MOTIVO DA OTIMIZAÇÃO:
      Antes, bibliotecas como `pdfmake`, `docx`, `mammoth` e `jszip` eram
      importadas via npm e embutidas diretamente no index.html gerado pelo
      vite-plugin-singlefile.
        - Antes (sem CDNs): index.html ≈ 3,26 MB
        - Depois (com CDNs): index.html ≈ 1,36 MB -> redução massiva!

      Como o app é distribuído como UM único arquivo HTML autônomo,
      carregar essas libs via CDN é a saída para não inchar o arquivo final.
      Elas são baixadas pelo navegador só quando necessário.

      OBS: isso exige INTERNET para manipular PDF, Word e ZIPs (o app
      também usa APIs online como ViaCEP/OpenCNPJ). Versões fixadas
      garantem estabilidade. Se precisar do modo 100% offline, remova 
      estas tags e o plugin `externalGlobals` no vite.config.ts.
      =====================================================================
    -->
    <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.3.11/build/pdfmake.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.3.11/build/vfs_fonts.js"></script>

    <!-- Word Export & Import & ZIP via CDN -->
    <script src="https://unpkg.com/docx@9.7.1/dist/index.umd.cjs"></script>
    <script src="https://unpkg.com/mammoth@1.12.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
